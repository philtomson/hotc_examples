<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPGA Control</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"><style>:root{--bg:#080a13;--card:rgba(18,22,40,0.6);--border:rgba(255,255,255,0.06);--text:#f1f3f9;--sec:#8493b0;--red:#ef4444;--green:#10b981}body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background-image:radial-gradient(circle at 15% 15%,rgba(59,130,246,0.1),transparent 40%),radial-gradient(circle at 85% 85%,rgba(139,92,246,0.1),transparent 40%)}.container{backdrop-filter:blur(20px);background:var(--card);border:1px solid var(--border);border-radius:28px;padding:30px;width:90%;max-width:360px;box-shadow:0 30px 60px rgba(0,0,0,0.4);text-align:center}h1{font-size:26px;font-weight:800;margin:0 0 4px 0;background:linear-gradient(135deg,#60a5fa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{color:var(--sec);font-size:12px;margin-bottom:24px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}.led-panel{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);border-radius:20px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;transition:all 0.3s}.led-panel:hover{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);transform:translateY(-2px)}.led-info{display:flex;align-items:center;gap:12px}.led-indicator{width:12px;height:12px;border-radius:50%;background:#2a3348;transition:all 0.4s}.led0-active .led-indicator{background:var(--red);box-shadow:0 0 15px var(--red)}.led1-active .led-indicator{background:var(--green);box-shadow:0 0 15px var(--green)}.led-title{text-align:left}.led-name{font-weight:600;font-size:15px}.led-desc{font-size:11px;color:var(--sec)}.btn-group{display:flex;gap:6px}a.btn{text-decoration:none;color:var(--text);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.03);transition:all 0.2s}a.btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.15)}a.btn-on{background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2));border-color:rgba(96,165,250,0.25)}a.btn-on:hover{background:linear-gradient(135deg,rgba(59,130,246,0.35),rgba(139,92,246,0.35));border-color:rgba(96,165,250,0.45);box-shadow:0 0 10px rgba(59,130,246,0.25)}.footer{font-size:9px;color:var(--sec);margin-top:24px;letter-spacing:0.8px;text-transform:uppercase;opacity:0.5}</style></head><body><div class="container"><h1>FPGA Control</h1><div class="subtitle">Tang Nano Server</div><div class="led-panel" id="led0-panel"><div class="led-info"><div class="led-indicator"></div><div class="led-title"><div class="led-name">Red LED</div><div class="led-desc">LED 0 (Pin 10)</div></div></div><div class="btn-group"><a href="/01" class="btn btn-on">ON</a><a href="/00" class="btn">OFF</a></div></div><div class="led-panel" id="led1-panel"><div class="led-info"><div class="led-indicator"></div><div class="led-title"><div class="led-name">Green LED</div><div class="led-desc">LED 1 (Pin 11)</div></div></div><div class="btn-group"><a href="/11" class="btn btn-on">ON</a><a href="/10" class="btn">OFF</a></div></div><div class="footer">Powered by Hotwright</div></div><script>window.addEventListener('DOMContentLoaded',()=>{fetch('/s').then(r=>r.json()).then(d=>{if(d.led0)document.getElementById('led0-panel').classList.add('led0-active');if(d.led1)document.getElementById('led1-panel').classList.add('led1-active')})});</script></body></html>
